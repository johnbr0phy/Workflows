const phases = [
  { id: 1, name: "Foundations", color: "purple", sessions: [
    { id: 1, title: "Why Workflows Exist", desc: "The single-context-window ceiling + three failure modes", duration: "~1 hour", topics: ["Why the default harness plans AND executes in one context window", "Agentic laziness — stops early after partial progress", "Self-preferential bias — prefers its own results when judging", "Goal drift — fidelity lost over many turns, worsened by lossy compaction", "How orchestrating separate Claudes fixes it"], exercises: ["Name the failure mode in three real scenarios (no tokens spent)", "Find a failure mode in one of your past Claude Code runs"], outcome: "Recognize — by name — when a task has outgrown a single context window, before it burns your time." },
    { id: 2, title: "Anatomy of a Workflow", desc: "JS harness, spawn/coordinate, models, worktrees, ultracode", duration: "~1 hour", topics: ["The harness is JavaScript Claude writes on the fly", "Special functions spawn & coordinate subagents; standard JS processes data", "Pick the model per agent (intelligence level)", "Each subagent can run in its own git worktree (isolation)", "Workflows are resumable — quit and pick up where you left off", "Trigger by asking, or with the word ultracode"], exercises: ["Run a quick ultracode workflow (~5k tokens) and read the harness", "Identify where agents spawn, models are chosen, and data is merged"], outcome: "Read a real workflow harness and point to spawn, model choice, worktrees, and the data glue." },
    { id: 3, title: "Dynamic vs Static + the Cost Mindset", desc: "Does this really need more compute?", duration: "~1 hour", topics: ["Static workflows (Agent SDK / claude -p) must cover all edge cases → generic", "Dynamic = Opus 4.8 writes a custom harness for the specific use case", "Workflows can use far more tokens; not needed for every task", "The one gating question: does this need more compute?"], exercises: ["Run the gut-check on your task and write a one-line verdict", "Contrast a static claude -p script vs a dynamic ultracode workflow"], outcome: "Decide for real whether a task warrants a workflow — and know that recognizing when not to is half the skill." }
  ]},
  { id: 2, name: "The Six Patterns", color: "blue", sessions: [
    { id: 4, title: "Fan-out-and-Synthesize", desc: "Split into many small steps; synthesize at a barrier", duration: "~1 hour", topics: ["One agent per small step, then synthesize", "Use it for many small steps, or when each needs a clean context window", "The synthesize step is a BARRIER", "The barrier waits for ALL fan-out agents, then merges their structured outputs"], exercises: ["Fan out one agent per file, synthesize a single table (~5k tokens — warns: fans out)", "Reason through what breaks if synthesize runs before the barrier"], outcome: "Turn N clean parallel agents into one coherent answer with a synthesis barrier." },
    { id: 5, title: "Adversarial Verification", desc: "A separate agent verifies each output (+ skeptic persona)", duration: "~1 hour", topics: ["For each spawned agent, a SEPARATE agent verifies its output against a rubric", "A separate verifier structurally sidesteps self-preferential bias", "A skeptic persona challenges weak flags to cut false positives"], exercises: ["Adversarially verify one claim against a rubric (quick workflow, ~5k tokens)", "Add a skeptic persona and watch a borderline false positive get dropped"], outcome: "Replace self-graded homework with an independent verifier — kept honest by a skeptic." },
    { id: 6, title: "Generate-and-Filter + Tournament", desc: "Many ideas → filter; or N approaches → pairwise judging", duration: "~1 hour", topics: ["Generate-and-filter: many ideas → filter by rubric → dedupe → keep the best", "Tournament: N agents try different approaches; a judge compares pairwise to a winner", "Comparative judgment beats absolute scoring"], exercises: ["Generate-and-filter candidate names for your workflow (quick workflow)", "Run a 3-agent tournament with pairwise judging (~5k tokens — warns: spawns N)"], outcome: "Produce higher-quality output via many tries plus a filter, and pick winners by comparison." },
    { id: 7, title: "Classify-and-Act + Model Routing", desc: "A classifier routes each item — and each model", duration: "~1 hour", topics: ["A classifier agent decides the task type and routes to different behavior", "You can also classify at the END to shape the output", "Model routing: route Sonnet vs Opus by expected complexity"], exercises: ["Classify 3 requests and route each to an agent + model (quick workflow)", "Try classify-at-the-end to pick an output template"], outcome: "Spend compute where it matters by routing items — and models — by type and complexity." },
    { id: 8, title: "Loop-until-Done", desc: "Loop until a stop condition (+ /goal and /loop)", duration: "~1 hour", topics: ["For unknown work volume, loop until a stop condition (no new findings / no errors)", "Beats running a fixed number of passes", "/goal sets a hard completion requirement", "/loop runs the workflow at intervals", "Cap an open loop by prompting a token budget"], exercises: ["Loop a 'find issues' agent until no new findings — HARD cap ~10k tokens", "Design how /goal + /loop turn it into a repeatable tool"], outcome: "Match effort to the real work with a stop condition, and make it repeatable and safe." }
  ]},
  { id: 3, name: "Applied + Shipping", color: "emerald", sessions: [

    { id: 10, title: "Triage at Scale + the Quarantine Pattern", desc: "Classify → dedupe → act, safely, with a security boundary", duration: "~1 hour", topics: ["Triage: classify each item → dedupe against what's tracked → act (fix or escalate)", "Pair with /loop for continuous triage", "Quarantine: agents reading untrusted content are barred from high-privilege actions", "Separate acting agents perform the privileged steps"], exercises: ["Triage 3 incoming items: classify, dedupe, act-vs-escalate (quick workflow)", "Design a quarantine boundary — design only, never grant privilege to readers"], outcome: "Triage items at volume and contain prompt-injection with a quarantine boundary." },
    { id: 11, title: "Big Structured Tasks", desc: "Migrations, sorting, root-cause, evals", duration: "~1 hour", topics: ["Migrations: one subagent per fix in a worktree → adversarial review → merge", "Tell agents to avoid resource-intensive commands to maximize parallelism", "Sorting: pairwise-comparison agents; don't sort 1000+ rows in one prompt", "Root-cause: independent hypotheses faced by verifiers & refuters", "Evals: agents in worktrees, graded by comparison agents against a rubric"], exercises: ["Map a big task from your world to a pattern per stage (discussion)", "Run a tiny pairwise sort of ~5 items (quick workflow)"], outcome: "See the six patterns recombine into migrations, sorting, root-cause, and evals." },

function SessionDetail({ session, phase, onBack, onNavigate, allSessions }) {
  const colorMap = {
    purple: { bg: 'bg-purple-100', text: 'text-purple-700', border: 'border-purple-200' },
    blue: { bg: 'bg-blue-100', text: 'text-blue-700', border: 'border-blue-200' },
    emerald: { bg: 'bg-emerald-100', text: 'text-emerald-700', border: 'border-emerald-200' },
    amber: { bg: 'bg-amber-100', text: 'text-amber-700', border: 'border-amber-200' }
  };
  const colors = colorMap[phase.color];
  const prev = allSessions.find(s => s.session.id === session.id - 1);
  const next = allSessions.find(s => s.session.id === session.id + 1);

  return (
    <>
      <button onClick={onBack} className="flex items-center gap-2 text-slate-500 hover:text-purple-600 mb-6">
        <ArrowLeft className="w-4 h-4" /><span className="text-sm">Back to Course Overview</span>
      </button>
      <section id="session-overview" className="mb-8 scroll-mt-20">
        <div className="flex items-center gap-3 mb-3">
          <span className={`text-xs font-semibold px-3 py-1 rounded-full ${colors.bg} ${colors.text}`}>Phase {phase.id}: {phase.name}</span>
          <span className="text-sm text-slate-500">Session {session.id} of 12</span>
        </div>
        <h1 className="text-3xl font-bold text-slate-900 mb-2">{session.title}</h1>
        <p className="text-lg text-slate-600">{session.desc}</p>
        <div className="mt-4 flex items-center gap-4 text-sm text-slate-500">
          <span>{session.duration}</span>
          <span>{session.topics?.length || 0} topics</span>
          <span>{session.exercises?.length || 0} exercises</span>
        </div>
      </section>
      {session.outcome && (
        <section id="session-outcome" className={`mb-8 p-4 rounded-xl ${colors.bg} ${colors.border} border scroll-mt-20`}>
          <div className="flex items-start gap-3">
            <CheckCircle className={`w-5 h-5 ${colors.text} mt-0.5 flex-shrink-0`} />
            <div><div className={`font-semibold ${colors.text} mb-1`}>By the end of this session</div><p className="text-slate-700">{session.outcome}</p></div>
          </div>
        </section>
      )}
      {session.topics && (
        <section id="session-topics" className="mb-8 scroll-mt-20">
          <h2 className="text-xl font-semibold text-slate-900 mb-4">What You'll Learn</h2>
          <div className="space-y-2">
            {session.topics.map((topic, i) => (
              <div key={i} className="flex items-start gap-3 p-3 bg-white rounded-lg border border-slate-200">
                <span className="text-sm font-mono text-slate-400 w-6">{i + 1}.</span>
                <span className="text-slate-700">{topic}</span>
              </div>
            ))}
          </div>
        </section>
      )}
      {session.exercises && (
        <section id="session-exercises" className="mb-8 scroll-mt-20">
          <h2 className="text-xl font-semibold text-slate-900 mb-4">Hands-On Exercises</h2>
          <div className="space-y-2">
            {session.exercises.map((ex, i) => (
              <div key={i} className="flex items-start gap-3 p-3 bg-white rounded-lg border border-slate-200">
                <Zap className="w-4 h-4 text-amber-500 mt-1 flex-shrink-0" />
                <span className="text-slate-700">{ex}</span>
              </div>
            ))}
          </div>
        </section>
      )}
      <div className="flex items-center justify-between pt-8 border-t border-slate-200 gap-4">
        {prev ? <button onClick={() => onNavigate(prev.session, prev.phase)} className="text-sm text-slate-600 hover:text-purple-600 flex items-center gap-2"><ArrowLeft className="w-4 h-4" />Session {prev.session.id}</button> : <div />}

      </div>
    </>
  );
}

function CourseSite() {
